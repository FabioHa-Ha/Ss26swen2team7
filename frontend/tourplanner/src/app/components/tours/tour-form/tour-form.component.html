<div class="p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-foreground">
          tour() ? 'Edit Tour' : 'Create New Tour'
        </h2>
        <button class="p-2 rounded-md hover:bg-secondary text-muted-foreground hover:text-foreground transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form class="space-y-5">
        <!-- Name -->
        <div class="space-y-2">
          <label for="name" class="block text-sm font-medium text-foreground">Tour Name</label>
          <input 
            type="text" 
            id="name"
            name="name"
            required
            class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
            placeholder="Enter tour name"
          >
        </div>

        <!-- Description -->
        <div class="space-y-2">
          <label for="description" class="block text-sm font-medium text-foreground">Description</label>
          <textarea 
            id="description"
            name="description"
            rows="3"
            class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring resize-none"
            placeholder="Describe the tour"
          ></textarea>
        </div>

        <!-- Transport Type -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-foreground">Transport Type</label>
          <div class="grid grid-cols-4 gap-2">
              <button 
                type="button"
                class="flex flex-col items-center gap-1.5 p-3 rounded-lg border border-border hover:border-primary/50 transition-colors"
              >
                <span></span>
                <span class="text-xs font-medium">type.label</span>
              </button>
          </div>
        </div>

        <!-- From / To -->
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-2">
            <label for="from" class="block text-sm font-medium text-foreground">From</label>
            <input 
              type="text" 
              id="from"
              name="from"
              required
              class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
              placeholder="Starting point"
            >
          </div>
          <div class="space-y-2">
            <label for="to" class="block text-sm font-medium text-foreground">To</label>
            <input 
              type="text" 
              id="to"
              name="to"
              required
              class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
              placeholder="Destination"
            >
          </div>
        </div>

        <!-- Distance / Time -->
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-2">
            <label for="distance" class="block text-sm font-medium text-foreground">Distance (km)</label>
            <input 
              type="number" 
              id="distance"
              name="distance"
              required
              min="0"
              step="0.1"
              class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
              placeholder="0"
            >
          </div>
          <div class="space-y-2">
            <label for="time" class="block text-sm font-medium text-foreground">Estimated Time (minutes)</label>
            <input 
              type="number" 
              id="time"
              name="estimatedTime"
              required
              min="0"
              class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
              placeholder="0"
            >
          </div>
        </div>

        <!-- Route Information -->
        <div class="space-y-2">
          <label for="routeInfo" class="block text-sm font-medium text-foreground">Route Information</label>
          <textarea 
            id="routeInfo"
            name="routeInformation"
            rows="3"
            class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring resize-none"
            placeholder="Detailed route information, waypoints, etc."
          ></textarea>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3 pt-4 border-t border-border">
          <button 
            type="button"
            class="px-4 py-2 rounded-lg border border-border hover:bg-secondary transition-colors"
          >
            Cancel
          </button>
          <button 
            type="submit"
            class="px-4 py-2 rounded-lg bg-primary text-primary-foreground hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            tour() ? 'Save Changes' : 'Create Tour'
          </button>
        </div>
      </form>
    </div>
