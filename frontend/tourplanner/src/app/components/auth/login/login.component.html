<div class="min-h-screen bg-background flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
          <div class="w-16 h-16 rounded-xl bg-primary flex items-center justify-center mx-auto mb-4">
            <svg class="w-9 h-9 text-primary-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-foreground">Welcome back</h1>
          <p class="text-muted-foreground mt-1">Sign in to your Tour Planner account</p>
        </div>

        <!-- Form -->
        <div class="bg-card border border-border rounded-xl p-6">
          <form (ngSubmit)="onSubmit()" class="space-y-4">
            <div class="space-y-2">
              <label for="email" class="block text-sm font-medium text-foreground">Email</label>
              <input 
                type="email" 
                id="email"
                name="email"
                [(ngModel)]="email"
                required
                class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
                placeholder="you@example.com"
              >
            </div>

            <div class="space-y-2">
              <label for="password" class="block text-sm font-medium text-foreground">Password</label>
              <input 
                type="password" 
                id="password"
                name="password"
                [(ngModel)]="password"
                required
                class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
                placeholder="Enter your password"
              >
            </div>

            <button 
              type="submit"
              class="w-full py-2.5 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Sign in
            </button>
          </form>

          <div class="mt-6 text-center">
            <span class="text-muted-foreground text-sm">Don't have an account?</span>
            <a routerLink="/register" class="text-primary hover:underline text-sm ml-1">Sign up</a>
          </div>
        </div>
      </div>
    </div>
  `
