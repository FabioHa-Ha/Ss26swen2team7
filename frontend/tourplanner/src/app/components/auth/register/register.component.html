<div class="min-h-screen bg-background flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
          <div class="w-16 h-16 rounded-xl bg-primary flex items-center justify-center mx-auto mb-4">
            <svg class="w-9 h-9 text-primary-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-foreground">Create an account</h1>
          <p class="text-muted-foreground mt-1">Start planning your tours today</p>
        </div>

        <!-- Form -->
        <div class="bg-card border border-border rounded-xl p-6">
          <form (ngSubmit)="onSubmit()" class="space-y-4">
              <!-- <div class="p-3 rounded-lg bg-destructive/10 border border-destructive/30 text-destructive text-sm">
                authService.error()
              </div> -->

            <div class="space-y-2">
              <label for="name" class="block text-sm font-medium text-foreground">Name</label>
              <input 
                [(ngModel)]="username"
                type="text" 
                id="name"
                name="name"
                required
                class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
                placeholder="Your name"
              >
            </div>

            <div class="space-y-2">
              <label for="email" class="block text-sm font-medium text-foreground">Email</label>
              <input 
                type="email" 
                id="email"
                name="email"
                required
                class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
                placeholder="you@example.com"
              >
            </div>

            <div class="space-y-2">
              <label for="password" class="block text-sm font-medium text-foreground">Password</label>
              <input 
                [(ngModel)]="password"
                type="password" 
                id="password"
                name="password"
                required
                minlength="6"
                class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
                placeholder="At least 8 characters"
              >
            </div>

            <div class="space-y-2">
              <label for="confirmPassword" class="block text-sm font-medium text-foreground">Confirm Password</label>
              <input 
                type="password" 
                id="confirmPassword"
                name="confirmPassword"
                required
                class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
                placeholder="Confirm your password"
              >
                <!-- <p class="text-sm text-destructive">Passwords don't match</p> -->
            </div>

            <button 
              type="submit"
              class="w-full py-2.5 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <!-- <span class="flex items-center justify-center gap-2">
                  <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                </span> -->
                Create account
            </button>
          </form>

          <div class="mt-6 text-center">
            <span class="text-muted-foreground text-sm">Already have an account?</span>
            <a routerLink="/login" class="text-primary hover:underline text-sm ml-1">Sign in</a>
          </div>
        </div>
      </div>
    </div>
